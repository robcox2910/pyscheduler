default_language_version:
  python: python3.14

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Pages paste real pytest output, trailing spaces included.
      - id: trailing-whitespace
        exclude: ^docs/property-testing\.md$
      - id: end-of-file-fixer
        exclude: ^docs/property-testing\.md$
      - id: check-yaml
        args: ['--unsafe']
      - id: check-added-large-files
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.408
    hooks:
      - id: pyright

  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
        entry: >-
          bash -c 'f=$(mktemp) &&
          uv export --frozen --no-emit-project --all-extras --no-hashes -o "$f" >/dev/null &&
          uvx pip-audit==2.10.0 -r "$f" --disable-pip --no-deps;
          status=$?; rm -f "$f"; exit $status'

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.13.8
    hooks:
      - id: commitizen
        stages: [commit-msg]
        additional_dependencies: [typing_extensions]
