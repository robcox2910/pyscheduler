[project]
name = "fromscratch-pyscheduler"
dynamic = ["version"]
description = "An educational Autosys/Control-M style job scheduler built from scratch in Python"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [
    { name = "Rob Cox" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
keywords = ["scheduler", "cron", "jobs", "education"]
dependencies = [
    "pynet",
    "pyweb",
    "pydb",
    "pymq",
]

[tool.uv.sources]
pynet = { git = "https://github.com/robcox2910/pynet", tag = "v0.1.1" }
pyweb = { git = "https://github.com/robcox2910/pyweb", tag = "v0.3.1" }
pydb = { git = "https://github.com/robcox2910/pydb", tag = "v0.4.1" }
pymq = { git = "https://github.com/robcox2910/pymq", tag = "v0.4.1" }

[project.scripts]
pysched = "pyscheduler.cli:main"
pysched-agent = "pyscheduler.agents.cli:main"

[project.urls]
Homepage = "https://github.com/robcox2910/pyscheduler"
Repository = "https://github.com/robcox2910/pyscheduler"
Issues = "https://github.com/robcox2910/pyscheduler/issues"
Documentation = "https://robcox2910.github.io/pyscheduler/"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.3",
    "pre-commit>=4.0.1",
    "pyright>=1.1.400",
    "commitizen>=4.4.0",
    "pip-audit>=2.10.0",
    "pytest-timeout>=2.3.1",
    "hypothesis>=6.170",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/pyscheduler/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pyscheduler"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]
exclude = ["src/pyscheduler/_version.py"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "C90",
    "PTH",
    "SIM",
    "TID",
    "S",
    "PERF",
    "FURB",
    "PIE",
    "T10",
    "T20",
    "ERA",
    "PL",
    "RET",
    "ARG",
    "FBT",
    "DTZ",
    "ICN",
    "PT",
    "D",
    "RUF",
    "A",
    "BLE",
    "EM",
    "FLY",
    "ISC",
    "PGH",
    "RSE",
    "SLF",
    "TRY",
]
ignore = [
    "E501", "D203", "D213", "ISC001", "TRY003",
    "PIE807", "PLW0108", "FBT001", "FBT003",
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-args = 9

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "SLF001"]
"examples/**/*.py" = ["T201"]
# The minder starts once per attempt and must import as little as it can:
# plain os paths instead of pathlib, try/except instead of contextlib.
"src/pyscheduler/minder.py" = ["PTH", "SIM105"]
# The brief names the exception Rejected (it reads as a verdict, not an error).
"src/pyscheduler/agents/signing.py" = ["N818"]
# The agent settles every order and turns any launch failure into a start error,
# whatever the exception; it logs only the exception's type, never a traceback
# (an exception's text or locals could carry the order's payload).
"src/pyscheduler/agents/worker.py" = ["BLE001", "TRY400"]
# The agent command line ends any unforeseen failure with one line, not a traceback.
"src/pyscheduler/agents/cli.py" = ["BLE001"]
# The hub settles every report whatever goes wrong and logs only the exception's
# type (a traceback could carry the payload).
"src/pyscheduler/agents/hub.py" = ["BLE001", "TRY400"]
# AgentOffline is the brief's name (it reads as a state, like Rejected), and
# fetch_log takes the brief's keyword arguments.
"src/pyscheduler/agents/hub_link.py" = ["N818", "PLR0913"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "tests/alerts", "tests/engine", "tests/api", "tests/agents"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--timeout=10",
    "--cov=src/pyscheduler",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*", "*/.venv/*", "*/_version.py"]

[tool.coverage.report]
precision = 2
show_missing = true

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = [".", "tests/alerts", "tests/engine", "tests/api", "tests/agents"]
reportPrivateUsage = false

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "scm"
