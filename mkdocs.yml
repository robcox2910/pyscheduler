site_name: PyScheduler
site_url: https://robcox2910.github.io/pyscheduler/
site_description: "Build your own job scheduler in Python: cron schedules, dependencies, retries, crash recovery and a web UI, explained for learners."
repo_url: https://github.com/robcox2910/pyscheduler
repo_name: robcox2910/pyscheduler

# theme:start
theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: default
      primary: deep-purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep-purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - search.highlight

# Social cards need cairo, so they are off unless SOCIAL_CARDS is set (the
# shared docs workflow sets it). A repo must not add its own plugins key.
plugins:
  - search
  - social:
      enabled: !ENV [SOCIAL_CARDS, false]
# theme:end

exclude_docs: |
  superpowers/

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - tables

nav:
  - Home: index.md
  - Concepts:
      - "The Scheduler Engine (The School Timetable)": concepts/scheduler.md
      - "YAML (A Recipe Card With Indents)": concepts/yaml.md
      - "Config Files (The Recipe Book)": concepts/config.md
      - "Templates and Values (Form Letters and Labels)": concepts/templates.md
      - "Cron Expressions (The Alarm Clock With Many Dials)": concepts/cron.md
      - "Calendars and Run Dates (School Days and Homework)": concepts/calendars-and-run-dates.md
      - "Time Zones and DST (The Clocks Change, and the Alarm Still Rings Once)": concepts/time-zones-and-dst.md
      - "Dependencies (You Can't Ice the Cake Before It's Baked)": concepts/dependencies.md
      - "Runs and States (The Traffic Lights of a Run)": concepts/runs-and-states.md
      - "Retries and Backoff (Knock Again, but Wait a Bit Longer Each Time)": concepts/retries-and-backoff.md
