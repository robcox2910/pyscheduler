site_name: PyScheduler
site_url: https://robcox2910.github.io/pyscheduler/
repo_url: https://github.com/robcox2910/pyscheduler
repo_name: robcox2910/pyscheduler

# theme:start
theme:
  name: material
  palette:
    - scheme: default
      primary: deep-purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep-purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - search.highlight
# theme:end

exclude_docs: |
  superpowers/

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - tables

nav:
  - Home: index.md
  - Concepts:
      - "YAML (A Recipe Card With Indents)": concepts/yaml.md
      - "Templates and Values (Form Letters and Labels)": concepts/templates.md
      - "Calendars and Run Dates (School Days and Homework)": concepts/calendars-and-run-dates.md
      - "Cron Expressions (The Alarm Clock With Many Dials)": concepts/cron.md
      - "Time Zones and DST (The Clocks Change, and the Alarm Still Rings Once)": concepts/time-zones-and-dst.md
      - "Config Files (The Recipe Book)": concepts/config.md
      - "Validation (The Teacher Who Checks Your Work Before the Test)": concepts/validation.md
      - "Forecast (The Weather Report for Jobs)": concepts/forecast.md
      - "The Minder (A Babysitter Who Writes a Note When the Job's Done)": concepts/the-minder.md
      - "Clocks and Launchers (A Practice Clock and a Starting Whistle)": concepts/clocks-and-launchers.md
      - "Runs and States (The Traffic Lights of a Run)": concepts/runs-and-states.md
      - "Group Commit (One Trip to the Post Box for Many Letters)": concepts/group-commit.md
      - "Dependencies (You Can't Ice the Cake Before It's Baked)": concepts/dependencies.md
      - "Pools and Limits (Only Two Kids on the Trampoline)": concepts/pools-and-limits.md
      - "Retries and Backoff (Knock Again, but Wait a Bit Longer Each Time)": concepts/retries-and-backoff.md
      - "The Scheduler Engine (The School Timetable)": concepts/scheduler.md
      - "Operator Actions (The Train Controller's Desk)": concepts/operator-actions.md
      - "Recovery and Catch-Up (Waking Up After a Nap and Reading the Babysitter's Notes)": concepts/recovery-and-catch-up.md
      - "The HTTP API (The Front Desk With Wristbands)": concepts/http-api.md
